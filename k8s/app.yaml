apiVersion: apps/v1
kind: Deployment
metadata:
  name: journal-app
  namespace: journal
  labels: {app: journal-app}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: journal-app}
  template:
    metadata:
      labels: {app: journal-app}
    spec:
      enableServiceLinks: false   # service env vars such as REDIS_PORT would clash with app settings
      terminationGracePeriodSeconds: 40
      containers:
        - name: app
          image: journal-app:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: journal-config}
            - secretRef: {name: journal-secret}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
            failureThreshold: 6
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 36
          lifecycle:
            preStop:
              exec: {command: ["sleep", "5"]}
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "1", memory: 640Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: journal-app
  namespace: journal
spec:
  type: ClusterIP
  selector: {app: journal-app}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
# Local-only path for the smoke test: kind maps host port 8080 to node port 30080.
apiVersion: v1
kind: Service
metadata:
  name: journal-app-nodeport
  namespace: journal
spec:
  type: NodePort
  selector: {app: journal-app}
  ports:
    - {name: http, port: 8080, targetPort: http, nodePort: 30080}
---
# Needs metrics-server, which is NOT installed in a default kind cluster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: journal-app
  namespace: journal
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: journal-app}
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
