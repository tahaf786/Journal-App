name: journal-app

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017/journal?replicaSet=rs0
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # LOCAL DEVELOPMENT VALUE ONLY. Override JWT_SECRET (32+ characters) for any shared or real deployment.
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-jwt-signing-value-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_CACHE_ENABLED: ${APP_CACHE_ENABLED:-true}
      # Ask-my-journal: set APP_RAG_ENABLED=true and start with --profile rag.
      APP_RAG_ENABLED: ${APP_RAG_ENABLED:-false}
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      RAG_CHAT_MODEL: ${RAG_CHAT_MODEL:-llama3.2:1b}
      JAVA_TOOL_OPTIONS: -Xmx384m
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: 640m

  mongo:
    image: mongo:7.0
    # Single-node replica set: MongoDB multi-document transactions require one.
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { if (rs.status().myState === 1) quit(0); quit(1) } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}); quit(1) }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    volumes:
      - mongo-data:/data/db
    mem_limit: 512m

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 256m

  # --- ask-my-journal (docker compose --profile rag up -d) ---
  ollama:
    image: ollama/ollama:0.5.7
    profiles: ["rag"]
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MAX_LOADED_MODELS: "2"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 10s
    volumes:
      - ollama-models:/root/.ollama
    mem_limit: 2g

  ollama-init:
    image: ollama/ollama:0.5.7
    profiles: ["rag"]
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull nomic-embed-text && ollama pull ${RAG_CHAT_MODEL:-llama3.2:1b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m

  qdrant:
    image: qdrant/qdrant:v1.12.4
    profiles: ["rag"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - qdrant-data:/qdrant/storage
    mem_limit: 512m

volumes:
  mongo-data:
  kafka-data:
  ollama-models:
  qdrant-data:
